<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Войти — AlmatSocial</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" href="/">Almat<span>Social</span></a>
    </div>
</nav>

<main class="section">
    <div class="container" style="max-width:720px; text-align: center; padding-top: 60px;">
        <h2 class="section-title" style="color: var(--accent); font-size: 32px; letter-spacing: -1px; margin-bottom: 12px;">AlmatSocial</h2>
        <p class="section-subtitle" style="font-size: 24px; color: #1c1e21; font-weight: normal; margin-bottom: 40px; padding: 0 40px;">AlmatSocial помогает вам всегда оставаться на связи и общаться со своими знакомыми.</p>

        <div class="feature" style="padding:24px; padding-bottom:32px; text-align: center; max-width: 440px; margin: 0 auto;">
            <form th:action="@{/login}" th:object="${loginForm}" method="post">
                <div class="form-group" style="text-align: left;">
                    <input id="email" type="email" th:field="*{email}" placeholder="Электронный адрес или номер телефона" required autofocus />
                </div>
                <div class="form-group" style="text-align: left;">
                    <input id="password" type="password" th:field="*{password}" placeholder="Пароль" required />
                </div>
                <div class="error" th:if="${error != null}" th:text="${error}"></div>
                <div style="margin-top:20px;">
                    <button type="submit" class="btn-primary" style="width: 100%; font-size: 20px; padding: 12px;">Вход</button>
                    <div style="margin: 16px 0;">
                        <a href="#" style="color: var(--accent); font-size: 14px;">Забыли пароль?</a>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;" />
                    <a href="/register" class="btn-cancel" style="background-color: #42b72a; color: white; margin: 0 auto; display: inline-block;">Создать новый аккаунт</a>
                </div>
            </form>
        </div>

    </div>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-brand">Almat<span>Social</span></div>
        <p>2026</p>
    </div>
</footer>
</body>
</html>
