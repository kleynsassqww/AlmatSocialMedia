<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-table th { background-color: #f4f4f4; }
        .btn-danger { background-color: #ff4d4d; color: #fff; padding: 5px 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container" style="padding-top: 50px;">
    <h2>Админ-панель: Управление сайтом</h2>
    <p><a th:href="@{/}">Выйти на главную</a></p>

    <h3>Пользователи</h3>
    <table class="admin-table">
        <thead>
            <tr>
                <th>ID</th><th>Имя</th><th>Email</th><th>Admin?</th><th>Verified?</th><th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.name}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.admin}"></td>
                <td th:text="${u.verified}"></td>
                <td>
                    <form th:action="@{/admin/delete-user}" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${u.id}" />
                        <button type="submit" class="btn-danger">Удалить</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
